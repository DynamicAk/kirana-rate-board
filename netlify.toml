# Static site: no build step. Netlify serves the project root.
[build]
  publish = "."

# Never cache the service worker, so new versions reach phones quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
